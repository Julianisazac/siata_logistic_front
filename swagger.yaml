openapi: 3.0.3
info:
  title: 🚚 SIATA Logistics API
  description: |
    📦 **Sistema Integral de Administración y Transporte de Almacenes**
    
    Bienvenido a la documentación oficial de la API de SIATA Logistics. 
    Este sistema proporciona una solución completa para la gestión logística,
    permitiendo el control total de clientes, productos, bodegas, puertos y envíos.
    
    ## 🌟 Características Principales
    - 👥 Gestión completa de clientes
    - 📦 Control de inventario de productos
    - 🏭 Administración de bodegas y almacenes
    - ⚓ Gestión de puertos marítimos
    - 🚛🚢 Sistema de envíos terrestres y marítimos
    - 📊 Seguimiento en tiempo real de envíos
    - 💰 Cálculo automático de costos y descuentos
    
    ## 🔐 Autenticación
    Actualmente la API no requiere autenticación, pero se recomienda implementar
    tokens JWT para producción.
    
    ## 🌍 Base URL
    ```
    http://localhost:3000
    ```
    
    ## 📝 Formato de Respuestas
    Todas las respuestas siguen el formato JSON estándar.
    
  version: 1.0.0
  contact:
    name: SIATA Logistics Team
    email: support@siata-logistics.com
    url: https://siata-logistics.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:3000
    description: 🚀 Servidor de Desarrollo
  - url: https://api.siata-logistics.com
    description: 🌐 Servidor de Producción

tags:
  - name: 👥 Clientes
    description: Gestión completa de clientes del sistema logístico
  - name: 📦 Productos
    description: Administración de productos y catálogo
  - name: 🏭 Bodegas
    description: Gestión de almacenes y bodegas
  - name: ⚓ Puertos
    description: Control de puertos marítimos
  - name: 🚚 Envíos
    description: Sistema de envíos terrestres y marítimos

paths:
  /clients:
    get:
      tags:
        - 👥 Clientes
      summary: 📋 Obtener todos los clientes
      description: |
        🔍 **Recupera la lista completa de clientes registrados en el sistema.**
        
        Este endpoint devuelve todos los clientes con su información básica incluyendo
        nombre, email y teléfono. Es ideal para listar clientes en el panel de administración
        o para sincronización con otros sistemas.
        
        ## 📊 Respuesta Típica
        ```json
        [
          {
            "id": 1,
            "name": "Juan Pérez",
            "email": "juan@ejemplo.com",
            "phone": "+57 300 123 4567"
          }
        ]
        ```
      operationId: getAllClients
      responses:
        '200':
          description: ✅ Lista de clientes obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'
              examples:
                lista_clientes:
                  summary: 📋 Ejemplo de lista de clientes
                  value:
                    - id: 1
                      name: "María González"
                      email: "maria@empresa.com"
                      phone: "+57 310 987 6543"
                    - id: 2
                      name: "Carlos Rodríguez"
                      email: "carlos@negocio.com"
                      phone: "+57 320 456 7890"
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - 👥 Clientes
      summary: ➕ Crear nuevo cliente
      description: |
        🆕 **Registra un nuevo cliente en el sistema logístico.**
        
        Este endpoint permite crear un nuevo cliente con toda su información básica.
        El cliente podrá ser utilizado posteriormente en la creación de envíos.
        
        ## 📝 Campos Requeridos
        - **name**: Nombre completo del cliente (mínimo 3 caracteres)
        - **email**: Correo electrónico válido (único en el sistema)
        - **phone**: Número telefónico (opcional pero recomendado)
        
        ## ⚠️ Consideraciones
        - El email debe ser único en el sistema
        - El nombre no puede estar vacío
        - El teléfono debe incluir código de país si es internacional
        
        ## 🎯 Casos de Uso
        - Registro de nuevos clientes corporativos
        - Incorporación de clientes individuales
        - Migración masiva de clientes
      operationId: createClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
            examples:
              cliente_nuevo:
                summary: 🆕 Ejemplo de nuevo cliente
                value:
                  name: "Ana Martínez"
                  email: "ana@nuevaempresa.com"
                  phone: "+57 315 234 5678"
              cliente_corporativo:
                summary: 🏢 Ejemplo de cliente corporativo
                value:
                  name: "Transportes Rápidos S.A."
                  email: "contacto@transportesrapidos.com"
                  phone: "+57 1 234 5678"
      responses:
        '201':
          description: ✅ Cliente creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                cliente_creado:
                  summary: 🎉 Cliente creado con éxito
                  value:
                    id: 123
                    name: "Ana Martínez"
                    email: "ana@nuevaempresa.com"
                    phone: "+57 315 234 5678"
        '400':
          description: ❌ Datos inválidos o email duplicado
          $ref: '#/components/responses/BadRequest'
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

  /clients/{id}:
    get:
      tags:
        - 👥 Clientes
      summary: 🔍 Obtener cliente por ID
      description: |
        🔎 **Busca un cliente específico utilizando su identificador único.**
        
        Este endpoint permite obtener los detalles completos de un cliente
        utilizando su ID. Es útil para mostrar información detallada o
        para editar datos existentes.
        
        ## 🎯 Casos de Uso
        - Visualización de perfil de cliente
        - Pre-carga de datos para edición
        - Verificación de existencia de cliente
        
        ## ⚠️ Notas
        - El ID debe ser un número entero válido
        - Si el cliente no existe, retorna error 404
      operationId: getClientById
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del cliente
          schema:
            type: integer
            minimum: 1
          example: 123
      responses:
        '200':
          description: ✅ Cliente encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                cliente_encontrado:
                  summary: 🔍 Cliente encontrado
                  value:
                    id: 123
                    name: "Ana Martínez"
                    email: "ana@nuevaempresa.com"
                    phone: "+57 315 234 5678"
        '404':
          description: ❌ Cliente no encontrado
          $ref: '#/components/responses/NotFound'
        '400':
          description: ❌ ID inválido
          $ref: '#/components/responses/BadRequest'

    put:
      tags:
        - 👥 Clientes
      summary: ✏️ Actualizar cliente existente
      description: |
        🔄 **Actualiza la información de un cliente existente.**
        
        Este endpoint permite modificar los datos de un cliente registrado.
        Todos los campos pueden ser actualizados, excepto el ID que es inmutable.
        
        ## 📝 Campos Actualizables
        - **name**: Nuevo nombre del cliente
        - **email**: Nuevo correo electrónico (debe ser único)
        - **phone**: Nuevo número telefónico
        
        ## ⚠️ Consideraciones Importantes
        - El email no puede coincidir con otro cliente existente
        - Se recomienda validar el formato del email antes de enviar
        - El teléfono debe incluir código de país para números internacionales
        
        ## 🎯 Casos de Uso
        - Actualización de datos de contacto
        - Cambio de razón social
        - Corrección de información errónea
      operationId: updateClient
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del cliente a actualizar
          schema:
            type: integer
            minimum: 1
          example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
            examples:
              actualizacion_parcial:
                summary: 🔄 Actualización de email
                value:
                  email: "nuevoemail@actualizado.com"
              actualizacion_completa:
                summary: 🔄 Actualización completa
                value:
                  name: "Ana Martínez Ltda."
                  email: "contacto@anamartinez.com"
                  phone: "+57 315 999 8888"
      responses:
        '200':
          description: ✅ Cliente actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
              examples:
                cliente_actualizado:
                  summary: 🎉 Cliente actualizado con éxito
                  value:
                    id: 123
                    name: "Ana Martínez Ltda."
                    email: "contacto@anamartinez.com"
                    phone: "+57 315 999 8888"
        '400':
          description: ❌ Datos inválidos o email duplicado
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ❌ Cliente no encontrado
          $ref: '#/components/responses/NotFound'
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - 👥 Clientes
      summary: 🗑️ Eliminar cliente
      description: |
        🚫 **Elimina permanentemente un cliente del sistema.**
        
        ⚠️ **ADVERTENCIA:** Esta acción es irreversible y eliminará:
        - Todos los datos del cliente
        - El historial de envíos asociados
        - Referencias en otros módulos
        
        ## 🔒 Consideraciones de Seguridad
        - Verificar que no haya envíos activos
        - Considerar archivar en lugar de eliminar
        - Realizar backup antes de eliminación
        
        ## 🎯 Casos de Uso
        - Eliminación por solicitud del cliente (RGPD)
        - Limpieza de datos duplicados
        - Remoción de cuentas de prueba
        
        ## ⚠️ Recomendaciones
        - Implementar confirmación doble en UI
        - Registrar auditoría de eliminación
        - Notificar a stakeholders relevantes
      operationId: deleteClient
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del cliente a eliminar
          schema:
            type: integer
            minimum: 1
          example: 123
      responses:
        '200':
          description: ✅ Cliente eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Cliente eliminado exitosamente"
              examples:
                eliminacion_exitosa:
                  summary: 🗑️ Cliente eliminado
                  value:
                    message: "Cliente eliminado exitosamente"
        '404':
          description: ❌ Cliente no encontrado
          $ref: '#/components/responses/NotFound'
        '400':
          description: ❌ Cliente con envíos activos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error_envios_activos:
                  summary: ⚠️ No se puede eliminar
                  value:
                    message: "No se puede eliminar el cliente. Tiene envíos activos asociados."
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

/products:
    get:
      tags:
        - 📦 Productos
      summary: 📋 Obtener todos los productos
      description: |
        🔍 **Recupera el catálogo completo de productos disponibles en el sistema.**
        
        Este endpoint devuelve todos los productos registrados con su información básica.
        Es ideal para mostrar el catálogo de productos, generar informes de inventario
        o sincronizar con sistemas externos.
        
        ## 📊 Respuesta Típica
        ```json
        [
          {
            "id": 1,
            "name": "Laptop Dell XPS 15",
            "description": "Laptop de alto rendimiento con procesador Intel i7"
          }
        ]
        ```
        
        ## 🎯 Casos de Uso
        - Carga de catálogo en frontend
        - Generación de reportes de inventario
        - Sincronización con ERP
        - Búsqueda de productos para envíos
      operationId: getAllProducts
      responses:
        '200':
          description: ✅ Lista de productos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
              examples:
                lista_productos:
                  summary: 📦 Ejemplo de catálogo de productos
                  value:
                    - id: 1
                      name: "Laptop Dell XPS 15"
                      description: "Laptop de alto rendimiento con procesador Intel i7, 16GB RAM, 512GB SSD"
                    - id: 2
                      name: "Monitor LG 27UL850"
                      description: "Monitor 4K de 27 pulgadas, USB-C, 60Hz"
                    - id: 3
                      name: "Teclado Mecánico RGB"
                      description: "Teclado gaming mecánico con retroiluminación RGB personalizable"
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - 📦 Productos
      summary: ➕ Crear nuevo producto
      description: |
        🆕 **Registra un nuevo producto en el catálogo del sistema.**
        
        Este endpoint permite agregar nuevos productos al inventario. Cada producto
        podrá ser utilizado posteriormente en la creación de envíos.
        
        ## 📝 Campos Requeridos
        - **name**: Nombre del producto (único en el sistema)
        - **description**: Descripción detallada del producto
        
        ## 🎯 Características Adicionales
        - El nombre debe ser único para evitar duplicados
        - La descripción puede incluir especificaciones técnicas
        - Los productos pueden ser físicos o digitales
        
        ## ⚠️ Consideraciones
        - Validar que el nombre no exista previamente
        - Incluir información relevante para logística
        - Considerar peso y dimensiones para envíos
        
        ## 📋 Ejemplos de Uso
        - Registro de nueva mercancía
        - Adición de productos a catálogo
        - Actualización de inventario
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
            examples:
              producto_tecnologico:
                summary: 💻 Producto tecnológico
                value:
                  name: "Smartphone Samsung Galaxy S24"
                  description: "Teléfono flagship con cámara de 50MP, 256GB almacenamiento, 5G"
              producto_general:
                summary: 📦 Producto general
                value:
                  name: "Caja de Herramientas Profesional"
                  description: "Set de 100 piezas con herramientas de alta calidad para profesionales"
      responses:
        '201':
          description: ✅ Producto creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                producto_creado:
                  summary: 🎉 Producto creado con éxito
                  value:
                    id: 456
                    name: "Smartphone Samsung Galaxy S24"
                    description: "Teléfono flagship con cámara de 50MP, 256GB almacenamiento, 5G"
        '400':
          description: ❌ Datos inválidos o nombre duplicado
          $ref: '#/components/responses/BadRequest'
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

  /products/{id}:
    get:
      tags:
        - 📦 Productos
      summary: 🔍 Obtener producto por ID
      description: |
        🔎 **Busca un producto específico utilizando su identificador único.**
        
        Este endpoint permite obtener los detalles completos de un producto
        utilizando su ID. Es útil para mostrar información detallada del producto
        o para verificar existencia antes de crear envíos.
        
        ## 🎯 Casos de Uso
        - Visualización de ficha de producto
        - Verificación de disponibilidad
        - Pre-carga de datos para edición
        - Consulta para generación de facturas
        
        ## ⚠️ Notas
        - El ID debe ser un número entero válido
        - Si el producto no existe, retorna error 404
      operationId: getProductById
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del producto
          schema:
            type: integer
            minimum: 1
          example: 456
      responses:
        '200':
          description: ✅ Producto encontrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                producto_encontrado:
                  summary: 🔍 Producto encontrado
                  value:
                    id: 456
                    name: "Smartphone Samsung Galaxy S24"
                    description: "Teléfono flagship con cámara de 50MP, 256GB almacenamiento, 5G"
        '404':
          description: ❌ Producto no encontrado
          $ref: '#/components/responses/NotFound'
        '400':
          description: ❌ ID inválido
          $ref: '#/components/responses/BadRequest'

    put:
      tags:
        - 📦 Productos
      summary: ✏️ Actualizar producto existente
      description: |
        🔄 **Actualiza la información de un producto existente en el catálogo.**
        
        Este endpoint permite modificar los datos de un producto registrado.
        Es útil para mantener actualizado el catálogo con nueva información,
        correcciones o cambios en especificaciones.
        
        ## 📝 Campos Actualizables
        - **name**: Nuevo nombre del producto (debe ser único)
        - **description**: Nueva descripción del producto
        
        ## ⚠️ Consideraciones Importantes
        - El nombre no puede coincidir con otro producto existente
        - Se recomienda mantener historial de cambios
        - La descripción debe ser clara y concisa
        
        ## 🎯 Casos de Uso
        - Actualización de especificaciones técnicas
        - Cambio de nombre comercial
        - Mejora de descripciones para marketing
        - Corrección de información errónea
      operationId: updateProduct
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del producto a actualizar
          schema:
            type: integer
            minimum: 1
          example: 456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
            examples:
              actualizacion_descripcion:
                summary: 📝 Actualización de descripción
                value:
                  description: "Teléfono flagship con cámara de 50MP, 256GB almacenamiento, 5G, pantalla AMOLED 120Hz"
              actualizacion_completa:
                summary: 🔄 Actualización completa
                value:
                  name: "Samsung Galaxy S24 Ultra"
                  description: "Teléfono premium con cámara de 200MP, S-Pen incluida, 512GB almacenamiento, 5G"
      responses:
        '200':
          description: ✅ Producto actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              examples:
                producto_actualizado:
                  summary: 🎉 Producto actualizado con éxito
                  value:
                    id: 456
                    name: "Samsung Galaxy S24 Ultra"
                    description: "Teléfono premium con cámara de 200MP, S-Pen incluida, 512GB almacenamiento, 5G"
        '400':
          description: ❌ Datos inválidos o nombre duplicado
          $ref: '#/components/responses/BadRequest'
        '404':
          description: ❌ Producto no encontrado
          $ref: '#/components/responses/NotFound'
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - 📦 Productos
      summary: 🗑️ Eliminar producto
      description: |
        🚫 **Elimina permanentemente un producto del catálogo.**
        
        ⚠️ **ADVERTENCIA:** Esta acción es irreversible y eliminará:
        - El producto del catálogo
        - Referencias en envíos existentes
        - Histórico de movimientos asociados
        
        ## 🔒 Consideraciones de Seguridad
        - Verificar que no haya envíos activos con este producto
        - Considerar marcar como discontinuado en lugar de eliminar
        - Realizar backup antes de eliminación
        
        ## 🎯 Casos de Uso
        - Eliminación de productos obsoletos
        - Limpieza de catálogo
        - Remoción de productos de prueba
        
        ## ⚠️ Recomendaciones
        - Implementar confirmación doble en UI
        - Registrar auditoría de eliminación
        - Notificar a equipos relevantes
      operationId: deleteProduct
      parameters:
        - name: id
          in: path
          required: true
          description: 🆔 Identificador único del producto a eliminar
          schema:
            type: integer
            minimum: 1
          example: 456
      responses:
        '200':
          description: ✅ Producto eliminado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Producto eliminado exitosamente"
              examples:
                eliminacion_exitosa:
                  summary: 🗑️ Producto eliminado
                  value:
                    message: "Producto eliminado exitosamente"
        '404':
          description: ❌ Producto no encontrado
          $ref: '#/components/responses/NotFound'
        '400':
          description: ❌ Producto con envíos activos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                error_envios_activos:
                  summary: ⚠️ No se puede eliminar
                  value:
                    message: "No se puede eliminar el producto. Tiene envíos activos asociados."
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

/warehouses:
    get:
      tags:
        - 🏭 Bodegas
      summary: 📋 Obtener todas las bodegas
      description: |
        🔍 **Recupera la lista completa de bodegas y almacenes disponibles.**
        
        Este endpoint devuelve todas las bodegas registradas con su información básica
        incluyendo nombre, ubicación y país. Es fundamental para la gestión logística
        y planificación de rutas de envío.
        
        ## 📊 Respuesta Típica
        ```json
        [
          {
            "id": 1,
            "name": "Bodega Central Bogotá",
            "location": "Calle 100 # 50-90",
            "country": "Colombia"
          }
        ]
        ```
        
        ## 🎯 Casos de Uso
        - Selección de bodega para envíos terrestres
        - Gestión de inventario por ubicación
        - Planificación de rutas logísticas
        - Reportes de capacidad de almacenamiento
      operationId: getAllWarehouses
      responses:
        '200':
          description: ✅ Lista de bodegas obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Warehouse'
              examples:
                lista_bodegas:
                  summary: 🏭 Ejemplo de lista de bodegas
                  value:
                    - id: 1
                      name: "Bodega Central Bogotá"
                      location: "Calle 100 # 50-90, Bogotá"
                      country: "Colombia"
                    - id: 2
                      name: "Centro de Distribución Medellín"
                      location: "Cra 65 # 30-75, Medellín"
                      country: "Colombia"
                    - id: 3
                      name: "Almacén Costeño Barranquilla"
                      location: "Vía 40 # 45-20, Barranquilla"
                      country: "Colombia"
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - 🏭 Bodegas
      summary: ➕ Crear nueva bodega
      description: |
        🆕 **Registra una nueva bodega en el sistema logístico.**
        
        Este endpoint permite agregar nuevas instalaciones de almacenamiento a la red.
        Cada bodega podrá ser utilizada como origen o destino en envíos terrestres.
        
        ## 📝 Campos Requeridos
        - **name**: Nombre de la bodega (único en el sistema)
        - **location**: Dirección física completa
        - **country**: País donde se ubica la bodega
        
        ## 🎯 Características Adicionales
        - Las bodegas son puntos clave en la cadena de suministro
        - Se pueden asignar capacidades y especializaciones
        - Integración con sistemas de gestión de inventario
        
        ## ⚠️ Consideraciones
