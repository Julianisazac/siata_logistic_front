      summary: 🚢 Crear envío marítimo
      description: |
        🆕 **Registra un nuevo envío marítimo en el sistema.**
        
        Este endpoint permite crear envíos marítimos asociados a clientes,
        productos y puertos. Incluye cálculo automático de costos y
        generación de número de tracking único.
        
        ## 📝 Campos Requeridos
        - **client_id**: ID del cliente (debe existir)
        - **product_id**: ID del producto (debe existir)
        - **quantity**: Cantidad de unidades (mínimo 1)
        - **price**: Precio unitario
        - **port_id**: ID del puerto de destino
        - **fleet_number**: Número de flota/barco
        - **delivery_date**: Fecha estimada de entrega
        
        ## 🎯 Características Adicionales
        - Generación automática de número de tracking
        - Cálculo automático de descuentos y totales
        - Asignación de tipo de envío: SEA
        - Registro de fecha y hora de creación
        
        ## 💰 Cálculo de Costos
        - **Total sin descuento**: quantity × price
        - **Descuento automático**: Aplica según reglas de negocio
        - **Total final**: Total con descuentos aplicados
        
        ## ⚠️ Consideraciones
        - Validar existencia de cliente, producto y puerto
        - Verificar formato de número de flota
        - La fecha de entrega debe considerar tiempos de tránsito marítimo
        
        ## 📋 Ejemplos de Uso
        - Exportaciones internacionales
        - Importaciones desde proveedores extranjeros
        - Envíos de gran volumen a nivel internacional
      operationId: createSeaShipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeaShipmentRequest'
            examples:
              envio_exportacion:
                summary: 🚢 Envío de exportación
                value:
                  client_id: 1
                  product_id: 1
                  quantity: 200
                  price: 150.00
                  port_id: 1
                  fleet_number: "CONTAINER2024A"
                  delivery_date: "2024-03-15"
              envio_importacion:
                summary: 📦 Envío de importación
                value:
                  client_id: 3
                  product_id: 3
                  quantity: 500
                  price: 50.00
                  port_id: 2
                  fleet_number: "CARGO789B"
                  delivery_date: "2024-04-01"
      responses:
        '201':
          description: ✅ Envío marítimo creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              examples:
                envio_creado:
                  summary: 🎉 Envío marítimo creado
                  value:
                    id: 1002
                    tracking_number: "TRK2024001002"
                    shipment_type: "SEA"
                    quantity: 200
                    price: 150.00
                    discount: 15.00
                    total_price: 29850.00
                    register_date: "2024-01-20T14:45:00Z"
                    delivery_date: "2024-03-15T00:00:00Z"
                    client: "María González"
                    product: "Laptop Dell XPS 15"
                    fleet_number: "CONTAINER2024A"
                    port: "Puerto de Cartagena"
        '400':
          description: ❌ Datos inválidos o entidades no encontradas
          $ref: '#/components/responses/BadRequest'
        '500':
          description: ❌ Error interno del servidor
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Client:
      type: object
      description: 👤 Representa un cliente en el sistema logístico
      properties:
        id:
          type: integer
          description: 🆔 Identificador único del cliente
          example: 123
          readOnly: true
        name:
          type: string
          description: 👤 Nombre completo del cliente
          minLength: 3
          maxLength: 100
          example: "María González Pérez"
        email:
          type: string
          format: email
          description: 📧 Correo electrónico del cliente
          example: "maria@empresa.com"
        phone:
          type: string
          description: 📱 Número telefónico del cliente
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+57 300 123 4567"
      required:
        - id
        - name
        - email
      xml:
        name: client

    CreateClientRequest:
      type: object
      description: 📝 Solicitud para crear un nuevo cliente
      properties:
        name:
          type: string
          description: 👤 Nombre completo del cliente
          minLength: 3
          maxLength: 100
          example: "Juan Carlos Rodríguez"
        email:
          type: string
          format: email
          description: 📧 Correo electrónico único del cliente
          example: "juan.carlos@nuevacompañia.com"
        phone:
          type: string
          description: 📱 Número telefónico (opcional pero recomendado)
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+57 315 777 8888"
      required:
        - name
        - email

    UpdateClientRequest:
      type: object
      description: ✏️ Solicitud para actualizar un cliente existente
      properties:
        name:
          type: string
          description: 👤 Nuevo nombre del cliente
          minLength: 3
          maxLength: 100
          example: "Juan Carlos Rodríguez S.A."
        email:
          type: string
          format: email
          description: 📧 Nuevo correo electrónico (debe ser único)
          example: "contacto@jcrodriguez.com"
        phone:
          type: string
          description: 📱 Nuevo número telefónico
          pattern: '^\+?[1-9]\d{1,14}$'
          example: "+57 1 234 5678 ext 101"

    Product:
      type: object
      description: 📦 Representa un producto en el catálogo del sistema
      properties:
        id:
          type: integer
          description: 🆔 Identificador único del producto
          example: 456
          readOnly: true
        name:
          type: string
          description: 📝 Nombre del producto
          minLength: 3
          maxLength: 200
          example: "Laptop Dell XPS 15"
        description:
          type: string
          description: 📄 Descripción detallada del producto
          maxLength: 1000
          example: "Laptop de alto rendimiento con procesador Intel i7, 16GB RAM, 512GB SSD"
      required:
        - id
        - name
        - description
      xml:
        name: product

    CreateProductRequest:
      type: object
      description: 📝 Solicitud para crear un nuevo producto
      properties:
        name:
          type: string
          description: 📝 Nombre único del producto
          minLength: 3
          maxLength: 200
          example: "Smartphone Samsung Galaxy S24"
        description:
          type: string
          description: 📄 Descripción detallada del producto
          maxLength: 1000
          example: "Teléfono flagship con cámara de 50MP, 256GB almacenamiento, 5G"
      required:
        - name
        - description

    UpdateProductRequest:
      type: object
      description: ✏️ Solicitud para actualizar un producto existente
      properties:
        name:
          type: string
          description: 📝 Nuevo nombre del producto (debe ser único)
          minLength: 3
          maxLength: 200
          example: "Samsung Galaxy S24 Ultra"
        description:
          type: string
          description: 📄 Nueva descripción del producto
          maxLength: 1000
          example: "Teléfono premium con cámara de 200MP, S-Pen incluida, 512GB almacenamiento, 5G"

    Warehouse:
      type: object
      description: 🏭 Representa una bodega en el sistema logístico
      properties:
        id:
          type: integer
          description: 🆔 Identificador único de la bodega
          example: 789
          readOnly: true
        name:
          type: string
          description: 📝 Nombre de la bodega
          minLength: 3
          maxLength: 200
          example: "Bodega Central Bogotá"
        location:
          type: string
          description: 📍 Dirección física completa de la bodega
          maxLength: 500
          example: "Calle 100 # 50-90, Bogotá"
        country:
          type: string
          description: 🌍 País donde se ubica la bodega
          minLength: 2
          maxLength: 100
          example: "Colombia"
      required:
        - id
        - name
        - location
        - country
      xml:
        name: warehouse

    CreateWarehouseRequest:
      type: object
      description: 📝 Solicitud para crear una nueva bodega
      properties:
        name:
          type: string
          description: 📝 Nombre único de la bodega
          minLength: 3
          maxLength: 200
          example: "Micro Centro Bogotá Norte"
        location:
          type: string
          description: 📍 Dirección física completa
          maxLength: 500
          example: "Calle 170 # 58-75, Bogotá"
        country:
          type: string
          description: 🌍 País de ubicación
          minLength: 2
          maxLength: 100
          example: "Colombia"
      required:
        - name
        - location
        - country

    UpdateWarehouseRequest:
      type: object
      description: ✏️ Solicitud para actualizar una bodega existente
      properties:
        name:
          type: string
          description: 📝 Nuevo nombre de la bodega (debe ser único)
          minLength: 3
          maxLength: 200
          example: "Centro Logístico Bogotá Norte"
        location:
          type: string
          description: 📍 Nueva dirección física
          maxLength: 500
          example: "Calle 170 # 58-75, Bogotá, Zona Industrial"
        country:
          type: string
          description: 🌍 Nuevo país si hay reubicación
          minLength: 2
          maxLength: 100
          example: "Colombia"

    Port:
      type: object
      description: ⚓ Representa un puerto marítimo en el sistema logístico
      properties:
        id:
          type: integer
          description: 🆔 Identificador único del puerto
          example: 101
          readOnly: true
        name:
          type: string
          description: 📝 Nombre del puerto
          minLength: 3
          maxLength: 200
          example: "Puerto de Cartagena"
        city:
          type: string
          description: 🏙️ Ciudad donde se ubica el puerto
          minLength: 2
          maxLength: 100
          example: "Cartagena"
        country:
          type: string
          description: 🌍 País donde se ubica el puerto
          minLength: 2
          maxLength: 100
          example: "Colombia"
      required:
        - id
        - name
        - city
        - country
      xml:
        name: port

    CreatePortRequest:
      type: object
      description: 📝 Solicitud para crear un nuevo puerto
      properties:
        name:
          type: string
          description: 📝 Nombre único del puerto
          minLength: 3
          maxLength: 200
          example: "Terminal Marítimo Santa Marta"
        city:
          type: string
          description: 🏙️ Ciudad de ubicación
          minLength: 2
          maxLength: 100
          example: "Santa Marta"
        country:
          type: string
          description: 🌍 País de ubicación
          minLength: 2
          maxLength: 100
          example: "Colombia"
      required:
        - name
        - city
        - country

    UpdatePortRequest:
      type: object
      description: ✏️ Solicitud para actualizar un puerto existente
      properties:
        name:
          type: string
          description: 📝 Nuevo nombre del puerto (debe ser único)
          minLength: 3
          maxLength: 200
          example: "Contecon Santa Marta"
        city:
          type: string
          description: 🏙️ Nueva ciudad si hay reubicación
          minLength: 2
          maxLength: 100
          example: "Santa Marta"
        country:
          type: string
          description: 🌍 Nuevo país si hay reubicación
          minLength: 2
          maxLength: 100
          example: "Colombia"

    Shipment:
      type: object
      description: 🚚 Representa un envío en el sistema logístico
      properties:
        id:
          type: integer
          description: 🆔 Identificador único del envío
          example: 1001
          readOnly: true
        tracking_number:
          type: string
          description: 📦 Número único de seguimiento
          example: "TRK2024001001"
          readOnly: true
        shipment_type:
          type: string
          enum: ["LAND", "SEA"]
          description: 🚛🚢 Tipo de envío (Terrestre/Marítimo)
          example: "LAND"
          readOnly: true
        quantity:
          type: integer
          description: 📊 Cantidad de unidades enviadas
          minimum: 1
          example: 5
        price:
          type: number
          format: decimal
          description: 💰 Precio unitario del producto
          minimum: 0
          example: 150.00
        discount:
          type: number
          format: decimal
          description: 🎁 Descuento aplicado automáticamente
          minimum: 0
          example: 5.00
          readOnly: true
        total_price:
          type: number
          format: decimal
          description: 💵 Precio total con descuentos
          minimum: 0
          example: 745.00
          readOnly: true
        register_date:
          type: string
          format: date-time
          description: 📅 Fecha y hora de registro del envío
          example: "2024-01-20T10:30:00Z"
          readOnly: true
        delivery_date:
          type: string
          format: date
          description: 📆 Fecha estimada de entrega
          example: "2024-02-01"
        client:
          type: string
          description: 👤 Nombre del cliente destinatario
          example: "María González"
          readOnly: true
        product:
          type: string
          description: 📦 Nombre del producto enviado
          example: "Laptop Dell XPS 15"
          readOnly: true
        vehicle_plate:
          type: string
          description: 🚗 Placa del vehículo (solo envíos terrestres)
          example: "ABC123"
          readOnly: true
        warehouse:
          type: string
          description: 🏭 Nombre de la bodega (solo envíos terrestres)
          example: "Bodega Central Bogotá"
          readOnly: true
        fleet_number:
          type: string
          description: 🚢 Número de flota/barco (solo envíos marítimos)
          example: "CONTAINER2024A"
          readOnly: true
        port:
          type: string
          description: ⚓ Nombre del puerto (solo envíos marítimos)
          example: "Puerto de Cartagena"
          readOnly: true
      required:
        - id
        - tracking_number
        - shipment_type
        - quantity
        - price
        - discount
        - total_price
        - register_date
        - delivery_date
        - client
        - product
      xml:
        name: shipment

    CreateLandShipmentRequest:
      type: object
      description: 🚛 Solicitud para crear un envío terrestre
      properties:
        client_id:
          type: integer
          description: 👤 ID del cliente existente
          minimum: 1
          example: 1
        product_id:
          type: integer
          description: 📦 ID del producto existente
          minimum: 1
          example: 1
        quantity:
          type: integer
          description: 📊 Cantidad de unidades a enviar
          minimum: 1
          example: 5
        price:
          type: number
          format: decimal
          description: 💰 Precio unitario
          minimum: 0
          example: 150.00
        warehouse_id:
          type: integer
          description: 🏭 ID de la bodega de origen
          minimum: 1
          example: 1
        vehicle_plate:
          type: string
          description: 🚗 Placa del vehículo de transporte
          minLength: 3
          maxLength: 10
          example: "ABC123"
        delivery_date:
          type: string
          format: date
          description: 📆 Fecha estimada de entrega
          example: "2024-02-01"
      required:
        - client_id
        - product_id
        - quantity
        - price
        - warehouse_id
        - vehicle_plate
        - delivery_date

    CreateSeaShipmentRequest:
      type: object
      description: 🚢 Solicitud para crear un envío marítimo
      properties:
        client_id:
          type: integer
          description: 👤 ID del cliente existente
          minimum: 1
          example: 1
        product_id:
          type: integer
          description: 📦 ID del producto existente
          minimum: 1
          example: 1
        quantity:
          type: integer
          description: 📊 Cantidad de unidades a enviar
          minimum: 1
          example: 200
        price:
          type: number
          format: decimal
          description: 💰 Precio unitario
          minimum: 0
          example: 150.00
        port_id:
          type: integer
          description: ⚓ ID del puerto de destino
          minimum: 1
          example: 1
        fleet_number:
          type: string
          description: 🚢 Número de flota/barco
          minLength: 3
          maxLength: 20
          example: "CONTAINER2024A"
        delivery_date:
          type: string
          format: date
          description: 📆 Fecha estimada de entrega
          example: "2024-03-15"
      required:
        - client_id
        - product_id
        - quantity
        - price
        - port_id
        - fleet_number
        - delivery_date

    Error:
      type: object
      description: ❌ Respuesta de error estándar
      properties:
        message:
          type: string
          description: 📝 Mensaje descriptivo del error
          example: "El email ya está registrado en el sistema"
        error_code:
          type: string
          description: 🔢 Código interno del error
          example: "EMAIL_ALREADY_EXISTS"
        details:
          type: object
          description: 📋 Detalles adicionales del error
          properties:
            field:
              type: string
              example: "email"
            value:
              type: string
              example: "existente@dominio.com"
      required:
        - message

  responses:
    BadRequest:
      description: ❌ Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            datos_invalidos:
              summary: 📝 Datos inválidos
              value:
                message: "El formato del email no es válido"
                error_code: "INVALID_EMAIL_FORMAT"
            email_duplicado:
              summary: 📧 Email duplicado
              value:
                message: "El email ya está registrado en el sistema"
                error_code: "EMAIL_ALREADY_EXISTS"

    NotFound:
      description: 🔍 Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            cliente_no_encontrado:
              summary: 👤 Cliente no encontrado
              value:
                message: "No se encontró el cliente con ID 999"
                error_code: "CLIENT_NOT_FOUND"

    InternalServerError:
      description: 💥 Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            error_interno:
              summary: 💥 Error del servidor
              value:
                message: "Error interno del servidor. Intente nuevamente más tarde."
                error_code: "INTERNAL_SERVER_ERROR"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 🔐 Autenticación mediante token JWT (a implementar)

security:
  - BearerAuth: []
